<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="264" viewBox="0 0 1000 264"><defs>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/><rect x="0.5" y="0.5" width="999" height="263" rx="14" fill="#0d1320" stroke="#1e2a44"/><text x="32" y="44" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b4c1de">Sou desenvolvedor Full Stack Júnior, de Maceió, Alagoas, com foco em web e mobile. Minha base é o</text><text x="32" y="70" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b4c1de">ecossistema <tspan fill="#6aa0ff" font-weight="600">React</tspan> e <tspan fill="#6aa0ff" font-weight="600">TypeScript</tspan>, mas gosto de entender o que acontece por trás das câmeras para</text><text x="32" y="96" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b4c1de">garantir que o projeto vá ao ar com qualidade.</text><text x="32" y="148" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b4c1de">Trabalho no setor de saúde, construindo chatbots de WhatsApp, fluxos de verificação facial,</text><text x="32" y="174" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b4c1de">painéis administrativos e dashboards. Também cuido do deploy com <tspan fill="#6aa0ff" font-weight="600">Docker</tspan>, <tspan fill="#6aa0ff" font-weight="600">Traefik</tspan>, <tspan fill="#6aa0ff" font-weight="600">AWS</tspan> e CI/CD. Não</text><text x="32" y="200" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b4c1de">sou especialista em DevOps, mas busco autonomia: aprendo na prática, pesquisando bastante e</text><text x="32" y="226" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b4c1de">entregando.</text></g></svg>